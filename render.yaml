# Render Blueprint - deploys the FastAPI backend as a free web service.
# Dashboard: New + -> Blueprint -> pick this repo. Set AI_PROVIDER / AI_API_KEY when prompted.
services:
  - type: web
    name: freightsentinel-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_MODE
        value: full
      - key: BATCH_CONCURRENCY
        value: "4"
      - key: CORS_ORIGINS
        value: "*"
