<text x="45" y="101" text-anchor="start" fill="#617f9a" font-size="20" font-weight="400">2026-09-21  ·  Frontend on Vercel / Backend on Render / Judgement by DeepSeek  ·  the API key never leaves the server</text>
<rect x="25" y="132" width="1250" height="84" rx="16" fill="#ffffff"/>
<text x="55" y="170" text-anchor="start" fill="#17324d" font-size="24" font-weight="700">① Who uses it</text>
<text x="55" y="200" text-anchor="start" fill="#617f9a" font-size="19" font-weight="400">Shipping operations and documentation staff — opens in a browser, nothing to install</text>
<polyline points="650.0,216 650.0,256" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#a)"/>
<text x="668.0" y="242.0" text-anchor="start" fill="#617f9a" font-size="18" font-weight="400">opens the web app</text>
<rect x="25" y="256" width="1250" height="250" rx="16" fill="#ffffff"/>
<text x="55" y="298" text-anchor="start" fill="#17324d" font-size="26" font-weight="700">② Frontend · Vercel</text>
<text x="55" y="330" text-anchor="start" fill="#617f9a" font-size="19" font-weight="400">Next.js 14.2.15  ·  React 18.3.1  ·  TypeScript 5.5.4  ·  App Router  ·  statically prerendered</text>
<rect x="55.0" y="348" width="226.8" height="74" rx="12" fill="#edf4fb" stroke="#adc0d2"/>
<text x="168.4" y="378" text-anchor="middle" fill="#17324d" font-size="19" font-weight="600">/</text>

<text x="409.20000000000005" y="378" text-anchor="middle" fill="#17324d" font-size="19" font-weight="600">/inbox</text>
<text x="409.20000000000005" y="404" text-anchor="middle" fill="#617f9a" font-size="15" font-weight="400">Inbox</text>
<rect x="536.6" y="348" width="226.8" height="74" rx="12" fill="#edf4fb" stroke="#adc0d2"/>
<text x="650.0" y="378" text-anchor="middle" fill="#17324d" font-size="19" font-weight="600">/runs</text>

<text x="1131.6000000000001" y="378" text-anchor="middle" fill="#17324d" font-size="19" font-weight="600">/cases/[id]</text>
<text x="1131.6000000000001" y="404" text-anchor="middle" fill="#617f9a" font-size="15" font-weight="400">Case detail</text>
<text x="55" y="454" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">Components: RunDonut outcome donut · OutcomeBar outcome bar · FieldTable seven-field table · ReviewWorkflow · StatusBadge · Nav</text>
<text x="55" y="482" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">LanguageProvider EN/ZH switch (text-node replacement + MutationObserver) · pages marked translate="no" so the browser does not translate them</text>

<text x="668.0" y="534.0" text-anchor="start" fill="#617f9a" font-size="18" font-weight="400">HTTPS  ·  REST / JSON  ·  CORS</text>
<rect x="25" y="550" width="1250" height="518" rx="16" fill="#ffffff"/>
<text x="55" y="592" text-anchor="start" fill="#17324d" font-size="26" font-weight="700">③ Backend · Render free tier</text>
<text x="55" y="624" text-anchor="start" fill="#617f9a" font-size="19" font-weight="400">Python 3.11.9  ·  FastAPI + uvicorn  ·  25 API endpoints  ·  /health answers both GET and HEAD</text>
<rect x="55.0" y="646" width="285.5" height="262" rx="14" fill="#edf4fb" stroke="#adc0d2"/>
<text x="197.75" y="678" text-anchor="middle" fill="#17324d" font-size="20" font-weight="700">Transport (code)</text>
<text x="71.0" y="710" text-anchor="start" fill="#617f9a" font-size="16" font-weight="600">main.py</text>
<text x="71.0" y="745" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">Routing, batch runs,</text>
<text x="71.0" y="770" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">cancel and retry,</text>
<text x="71.0" y="795" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">dashboard counts, export</text>
<text x="71.0" y="820" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">of the official</text>
<text x="71.0" y="845" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">submission file.</text>
<rect x="356.5" y="646" width="285.5" height="262" rx="14" fill="#edf4fb" stroke="#adc0d2"/>
<text x="499.25" y="678" text-anchor="middle" fill="#17324d" font-size="20" font-weight="700">Parsing (code)</text>
<text x="372.5" y="710" text-anchor="start" fill="#617f9a" font-size="16" font-weight="600">parsers.py · extract.py ·</text>
<text x="372.5" y="733" text-anchor="start" fill="#617f9a" font-size="16" font-weight="600">data.py</text>
<text x="372.5" y="768" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">Unpacks the official</text>
<text x="372.5" y="793" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">email bundle and pulls</text>
<text x="372.5" y="818" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">text out of PDF / DOCX /</text>
<text x="372.5" y="843" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">XLSX. Text only, never</text>
<text x="372.5" y="868" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">meaning.</text>
<rect x="658.0" y="646" width="285.5" height="262" rx="14" fill="#e9f3ff" stroke="#adc0d2"/>
<text x="800.75" y="678" text-anchor="middle" fill="#17324d" font-size="20" font-weight="700">Judgement (AI)</text>
<text x="674.0" y="710" text-anchor="start" fill="#617f9a" font-size="16" font-weight="600">ai.py · classify.py ·</text>
<text x="674.0" y="733" text-anchor="start" fill="#617f9a" font-size="16" font-weight="600">compare.py</text>
<text x="674.0" y="768" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">Email classification,</text>
<text x="674.0" y="793" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">seven-field comparison,</text>
<text x="674.0" y="818" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">status and reason — the</text>
<text x="674.0" y="843" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">only place a business</text>
<text x="674.0" y="868" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">decision is made.</text>
<rect x="959.5" y="646" width="285.5" height="262" rx="14" fill="#e6f5ee" stroke="#adc0d2"/>
<text x="1102.25" y="678" text-anchor="middle" fill="#17324d" font-size="20" font-weight="700">Validation (code)</text>
<text x="975.5" y="710" text-anchor="start" fill="#617f9a" font-size="16" font-weight="600">ai_contract.py ·</text>
<text x="975.5" y="733" text-anchor="start" fill="#617f9a" font-size="16" font-weight="600">pipeline.py · schemas.py</text>
<text x="975.5" y="768" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">Checks JSON shape, closed</text>
<text x="975.5" y="793" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">vocabulary, quoted</text>
<text x="975.5" y="818" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">evidence and</text>
<text x="975.5" y="843" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">self-consistency. It can</text>
<text x="975.5" y="868" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">only reject and escalate,</text>
<text x="975.5" y="893" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">never re-decide.</text>
<rect x="55" y="932" width="1190" height="108" rx="14" fill="#edf4fb" stroke="#adc0d2"/>
<text x="71" y="964" text-anchor="start" fill="#17324d" font-size="19" font-weight="600">State (code)　store.py · revisions.py · recovery.py · workflow.py · submission.py</text>
<text x="71" y="996" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">Holds each email's verdict, human progress, BL revision history and the original attachments. Render's free disk is</text>
<text x="71" y="1021" text-anchor="start" fill="#17324d" font-size="17" font-weight="400">ephemeral, so a restart means a re-run.</text>
<polyline points="650.0,1068 650.0,1112" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#a)"/>
<text x="668.0" y="1096.0" text-anchor="start" fill="#617f9a" font-size="18" font-weight="400">HTTPS  ·  the API key stays in server-side environment variables</text>
<rect x="25" y="1112" width="1250" height="168" rx="16" fill="#ffffff"/>
<text x="55" y="1152" text-anchor="start" fill="#17324d" font-size="26" font-weight="700">④ Judgement · DeepSeek API</text>
<rect x="100.0" y="1174" width="450" height="84" rx="14" fill="#e9f3ff" stroke="#adc0d2"/>
<text x="325.0" y="1204" text-anchor="middle" fill="#17324d" font-size="20" font-weight="700">Primary　deepseek-flash</text>
<text x="325.0" y="1234" text-anchor="middle" fill="#617f9a" font-size="18" font-weight="400">thinking = true　·　reasoning_effort = high</text>
<rect x="750.0" y="1174" width="450" height="84" rx="14" fill="#e6f5ee" stroke="#adc0d2"/>
<text x="975.0" y="1204" text-anchor="middle" fill="#17324d" font-size="20" font-weight="700">Senior review　deepseek-flash</text>
<text x="975.0" y="1234" text-anchor="middle" fill="#617f9a" font-size="18" font-weight="400">thinking = true　·　reasoning_effort = max</text>
<polyline points="564.0,1224 736.0,1224" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#a)"/>
<text x="650.0" y="1208" text-anchor="middle" fill="#617f9a" font-size="17" font-weight="400">only on NEEDS_REVIEW</text>
<rect x="1315" y="132" width="460" height="326" rx="16" fill="#ffffff"/>
<text x="1341" y="170" text-anchor="start" fill="#17324d" font-size="20" font-weight="700">Deployment</text>
<text x="1341" y="194" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· render.yaml Blueprint pins 19 environment</text>
<text x="1341" y="217" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">variables; only AI_API_KEY is asked for at</text>
<text x="1341" y="240" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">deploy time. CACHE_DIR must never be set in</text>
<text x="1341" y="263" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">the cloud.</text>
<text x="1341" y="294" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· AI_SENIOR_PROVIDER must match</text>
<text x="1341" y="317" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">AI_PROVIDER, or the senior stage disables</text>
<text x="1341" y="340" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">itself silently.</text>
<text x="1341" y="371" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· Render never auto-deploys in practice —</text>
<text x="1341" y="394" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">every change needs a manual Deploy latest</text>
<text x="1341" y="417" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">commit.</text>
<rect x="1315" y="474" width="460" height="180" rx="16" fill="#ffffff"/>
<text x="1341" y="512" text-anchor="start" fill="#17324d" font-size="20" font-weight="700">Keeping it awake</text>
<text x="1341" y="536" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· A free instance sleeps after 15 idle</text>
<text x="1341" y="559" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">minutes and cold-starts slowly.</text>
<text x="1341" y="590" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· UptimeRobot pings /health every 5 minutes</text>
<text x="1341" y="613" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">(GET and HEAD are both answered).</text>
<rect x="1315" y="670" width="460" height="234" rx="16" fill="#ffffff"/>
<text x="1341" y="708" text-anchor="start" fill="#17324d" font-size="20" font-weight="700">Data and output</text>
<text x="1341" y="732" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· The official 520-email bundle ships with</text>
<text x="1341" y="755" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">the repo and is unpacked at startup.</text>
<text x="1341" y="786" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· AI responses are cached locally only —</text>
<text x="1341" y="809" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">never committed, never uploaded.</text>
<text x="1341" y="840" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· Exports submission.json in the official</text>
<text x="1341" y="863" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">format (520 rows × 5 fields).</text>
<rect x="1315" y="920" width="460" height="234" rx="16" fill="#fff2dc"/>
<text x="1341" y="958" text-anchor="start" fill="#17324d" font-size="20" font-weight="700">Key boundary</text>
<text x="1341" y="982" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· The key lives only in Render's</text>
<text x="1341" y="1005" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">environment and a local .env.</text>
<text x="1341" y="1036" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· The frontend never receives it; every</text>
<text x="1341" y="1059" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">model call is made server-side.</text>
<text x="1341" y="1090" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· .gitignore covers .env and .env.* — never</text>
<text x="1341" y="1113" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">committed, never logged.</text>
<rect x="1315" y="1170" width="460" height="303" rx="16" fill="#edf4fb"/>
<text x="1341" y="1208" text-anchor="start" fill="#17324d" font-size="20" font-weight="700">Standby provider</text>
<text x="1341" y="1232" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· A Gemini adapter is written:</text>
<text x="1341" y="1255" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">thinkingLevel medium for the primary stage,</text>
<text x="1341" y="1278" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">high for the senior one, with a truncation</text>
<text x="1341" y="1301" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">check.</text>
<text x="1341" y="1332" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· On 2026-09-21 Google returned 503</text>
<text x="1341" y="1355" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">persistently, so the preliminary round</text>
<text x="1341" y="1378" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">stays on DeepSeek.</text>
<text x="1341" y="1409" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">· If we reach the final, a full 520-email</text>
<text x="1341" y="1432" text-anchor="start" fill="#17324d" font-size="16" font-weight="400">run decides whether to switch.</text>
<text x="45" y="1318" text-anchor="start" fill="#17324d" font-size="20" font-weight="400">Code only parses files, validates format and evidence, routes and stores. Every business decision is made</text>
<text x="45" y="1346" text-anchor="start" fill="#17324d" font-size="20" font-weight="400">by the AI, or by the person who finally handles the case — there is no rule-engine fallback.</text>
<text x="45" y="1378" text-anchor="start" fill="#617f9a" font-size="18" font-weight="400">The senior stage runs only on NEEDS_REVIEW, so a settled result is never paid for twice; if it is still unsure the case</text>
<text x="45" y="1404" text-anchor="start" fill="#617f9a" font-size="18" font-weight="400">goes to a human and never returns to the AI.</text>
</svg></main><script>const z=document.querySelector("#z"),s=document.querySelector("svg"),p=document.querySelector("#p");z.oninput=e=>{const v=+e.target.value;s.style.width=(1800*v/100)+"px";p.textContent=v+"%"}</script></body></html>
