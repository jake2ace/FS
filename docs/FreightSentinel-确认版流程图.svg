<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1500" viewBox="0 0 1680 1500"><title>FreightSentinel 深度思考与人工最终处理流程</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#617f9a"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1680" height="1500" fill="#f2f6fa"/><text x="45" y="56" text-anchor="start" fill="#17324d" font-size="36" font-weight="700">FreightSentinel · 确认版流程</text><text x="45" y="97" text-anchor="start" fill="#17324d" font-size="22" font-weight="400">2026-09-20  ·  首轮 high 思考 → max 思考复核 → 人工最终处理  ·  原始附件保留</text><rect x="25" y="130" width="510" height="960" rx="20" fill="white"/><text x="280" y="173" text-anchor="middle" fill="#17324d" font-size="26" font-weight="700">① 首轮 AI · high 思考</text><rect x="585" y="130" width="510" height="960" rx="20" fill="white"/><text x="840" y="173" text-anchor="middle" fill="#17324d" font-size="26" font-weight="700">② 仅复核不确定案件</text><rect x="1145" y="130" width="510" height="960" rx="20" fill="white"/><text x="1400" y="173" text-anchor="middle" fill="#17324d" font-size="26" font-weight="700">③ 人工是最后一步</text><rect x="55" y="205" width="450" height="85" rx="15" fill="#edf4fb" stroke="#adc0d2"/><text x="280.0" y="239.5" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">收到邮件</text><text x="280.0" y="271.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">读取当前正文、主题及附件信息</text><polyline points="280,290 280,330" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="55" y="330" width="450" height="115" rx="15" fill="#edf4fb" stroke="#adc0d2"/><text x="280.0" y="363.5" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">DeepSeek 判断五种邮件类别</text><text x="280.0" y="395.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">非 BL_COMPARISON：记录类别后结束</text><text x="280.0" y="427.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">BL_COMPARISON：继续核对附件</text><polyline points="280,445 280,485" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="55" y="485" width="450" height="135" rx="15" fill="#edf4fb" stroke="#adc0d2"/><text x="280.0" y="528.5" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">读取 SI 与 draft BL</text><text x="280.0" y="560.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">程序解析 / 必要时 OCR</text><text x="280.0" y="592.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">AI 确认文件类型和缺失情况</text><polyline points="280,620 280,660" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="55" y="660" width="450" height="125" rx="15" fill="#edf4fb" stroke="#adc0d2"/><text x="280.0" y="698.5" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">AI 提取并比较七个字段</text><text x="280.0" y="730.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">统一写法、单位和字段含义</text><text x="280.0" y="762.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">每个读数必须有原文证据</text><polyline points="280,785 280,830" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="55" y="830" width="450" height="205" rx="15" fill="#e9f3ff" stroke="#adc0d2"/><text x="280.0" y="876.5" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">首轮结果</text><text x="280.0" y="908.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">可靠一致 → OK，结束</text><text x="280.0" y="940.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">确定差异 → MISMATCH，见下方副本流程</text><text x="280.0" y="972.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">不确定 / 调用失败 / 无效 JSON</text><text x="280.0" y="1004.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">→ 深度思考复核</text><polyline points="505,977 557,977 557,258 615,258" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="205" width="450" height="110" rx="15" fill="#edf4fb" stroke="#adc0d2"/><text x="840.0" y="236.0" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">复核触发条件</text><text x="840.0" y="268.0" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">不能确定、读取失败、字段缺失</text><text x="840.0" y="300.0" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">输出无效或证据校验未通过</text><polyline points="840,315 840,370" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="370" width="450" height="115" rx="15" fill="#edf4fb" stroke="#adc0d2"/><text x="840.0" y="403.5" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">DeepSeek Flash 深度思考</text><text x="840.0" y="435.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">thinking = enabled</text><text x="840.0" y="467.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">reasoning_effort = max</text><polyline points="840,485 840,535" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="535" width="450" height="115" rx="15" fill="#edf4fb" stroke="#adc0d2"/><text x="840.0" y="568.5" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">重新根据原始资料判断</text><text x="840.0" y="600.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">遵守相同七字段和证据要求</text><text x="840.0" y="632.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">缺失的事实不能凭空补出</text><polyline points="840,650 840,700" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="700" width="450" height="130" rx="15" fill="#e6f5ee" stroke="#adc0d2"/><text x="840.0" y="741.0" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">复核结果分流</text><text x="840.0" y="773.0" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">一致 → OK，结束</text><text x="840.0" y="805.0" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">确定差异 → MISMATCH，见副本流程</text><text x="925" y="859" text-anchor="middle" fill="#617f9a" font-size="18">无法确定时</text><polyline points="840,830 840,875" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="875" width="450" height="135" rx="15" fill="#fff2dc" stroke="#adc0d2"/><text x="840.0" y="918.5" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">仍不能确定 / 服务不可用</text><text x="840.0" y="950.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">NEEDS_REVIEW + 原因</text><text x="840.0" y="982.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">保留首轮和复核记录 → 人工</text><polyline points="1065,945 1117,945 1117,258 1175,258" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="1175" y="205" width="450" height="110" rx="15" fill="#fff2dc" stroke="#adc0d2"/><text x="1400.0" y="236.0" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">进入人工队列</text><text x="1400.0" y="268.0" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">高级 AI 未配置也直接进入这里</text><text x="1400.0" y="300.0" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">分类失败：类别待人工确认</text><polyline points="1400,315 1400,375" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="1175" y="375" width="450" height="120" rx="15" fill="#edf4fb" stroke="#adc0d2"/><text x="1400.0" y="411.0" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">人工查看实际邮件和附件</text><text x="1400.0" y="443.0" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">核实信息、联系相关人员</text><text x="1400.0" y="475.0" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">补资料或在业务中完成修正</text><polyline points="1400,495 1400,555" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="1175" y="555" width="450" height="135" rx="15" fill="#edf4fb" stroke="#adc0d2"/><text x="1400.0" y="598.5" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">记录人工结论与处理说明</text><text x="1400.0" y="630.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">确认原始邮件类别、检测结果</text><text x="1400.0" y="662.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">有差异则明确哪些字段不同</text><polyline points="1400,690 1400,755" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="1175" y="755" width="450" height="110" rx="15" fill="#e6f5ee" stroke="#adc0d2"/><text x="1400.0" y="786.0" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">人工确认处理完成</text><text x="1400.0" y="818.0" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">RESOLVED_BY_HUMAN</text><text x="1400.0" y="850.0" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">尚未处理完可保存人工进度</text><polyline points="1400,865 1400,930" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="1175" y="930" width="450" height="100" rx="15" fill="#d2eee0" stroke="#adc0d2"/><text x="1400.0" y="972.0" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">结束</text><text x="1400.0" y="1004.0" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">不再返回 AI；重开也继续由人工处理</text><text x="45" y="1141" text-anchor="start" fill="#17324d" font-size="27" font-weight="700">确定 MISMATCH 后的副本流程</text><rect x="45" y="1170" width="440" height="155" rx="15" fill="#edf4fb" stroke="#adc0d2"/><text x="265.0" y="1223.5" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">按 SI 生成原格式 BL 副本</text><text x="265.0" y="1255.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">实际文件先交 AI 核对</text><text x="265.0" y="1287.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">无法安全修改或核对失败 → 人工</text><polyline points="485,1248 565,1248" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="565" y="1170" width="490" height="155" rx="15" fill="#edf4fb" stroke="#adc0d2"/><text x="810.0" y="1223.5" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">人工审核是否采纳</text><text x="810.0" y="1255.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">采纳：保留副本，处理完成</text><text x="810.0" y="1287.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">不采纳：删除副本，继续人工处理</text><polyline points="1055,1248 1135,1248" fill="none" stroke="#617f9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="1135" y="1170" width="500" height="155" rx="15" fill="#e6f5ee" stroke="#adc0d2"/><text x="1385.0" y="1223.5" text-anchor="middle" fill="#17324d" font-size="23" font-weight="600">采纳不再调用 AI</text><text x="1385.0" y="1255.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">仅检查已审副本未被改动</text><text x="1385.0" y="1287.5" text-anchor="middle" fill="#17324d" font-size="20" font-weight="400">原始附件、历史判断与处理记录保留</text><text x="45" y="1380" text-anchor="start" fill="#17324d" font-size="20" font-weight="400">七字段：shipper · consignee · notify party · port of loading · port of discharge · container count · gross weight</text><text x="45" y="1420" text-anchor="start" fill="#17324d" font-size="22" font-weight="400">程序只做文件操作、输出与证据校验、流程转交和保存；业务判断由 AI 或最终处理的人作出。</text><text x="45" y="1460" text-anchor="start" fill="#17324d" font-size="21" font-weight="400">测试范围以报告为准：少量问题邮件通过，不代表全部 520 封准确率已通过。</text></svg>